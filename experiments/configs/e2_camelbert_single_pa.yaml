# CAMeL-BERT MSA — single-task baseline on PA
# Model stored as a direct directory (not HF cache format) — use absolute path
experiment_id: e2
model_name: CAMeL-Lab/bert-base-arabic-camelbert-msa
task_mode: single
subtasks: [PA]
epochs: 5
batch_size: 16
lr: 2.0e-5
max_length: 512
output_dir: outputs/e2
seed: 42
warmup_ratio: 0.1
weight_decay: 0.01
grad_clip: 1.0
num_workers: 4
trust_remote_code: false
