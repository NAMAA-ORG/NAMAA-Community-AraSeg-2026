experiment_id: e71
model_name: xlm-roberta-large
task_mode: single
subtasks: [NoPnx-PA]
epochs: 10
batch_size: 8
lr: 1.0e-5
max_length: 512
output_dir: outputs/e71
seed: 1
warmup_ratio: 0.1
weight_decay: 0.01
grad_clip: 1.0
num_workers: 4
trust_remote_code: false
pos_weight: 2.0
# Kareem's recipe: train + dev input is NoPnx-PA with Naqta-restored punctuation.
# Same clone as e17 otherwise, so any gain is the restoration, not the backbone.
# Eval on restored TEST via: restore_then_segment.py --trained-member this-config.
naqta_restore: true
naqta_restore_min_p: 0.3   # 0.3 gave the best inference-mode recall; sweep if it wins
