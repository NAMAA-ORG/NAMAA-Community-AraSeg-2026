# XLM-R Large — single-task baseline on PA
# Model is in HF cache: resolved automatically via HF_HOME env var set in SLURM script
experiment_id: e3
model_name: xlm-roberta-large
task_mode: single
subtasks: [PA]
epochs: 5
batch_size: 8          # 560M params — keep batch small
lr: 1.0e-5             # smaller lr for larger model
max_length: 512
output_dir: outputs/e3
seed: 42
warmup_ratio: 0.1
weight_decay: 0.01
grad_clip: 1.0
num_workers: 4
trust_remote_code: false
