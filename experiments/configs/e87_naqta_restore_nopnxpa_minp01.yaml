experiment_id: e87
model_name: xlm-roberta-large
task_mode: single
subtasks: [NoPnx-PA]
epochs: 10
batch_size: 8
lr: 1.0e-5
max_length: 512
output_dir: outputs/e87
seed: 1
warmup_ratio: 0.1
weight_decay: 0.01
grad_clip: 1.0
num_workers: 4
trust_remote_code: false
pos_weight: 2.0
# min-p comparison against e75: same comma correction (so the min-p contrast is not
# confounded by the mark), lower insertion threshold -> more marks inserted. The
# e75-vs-e71 delta measures the comma; the e87-vs-e75 delta measures min-p. Do not
# read either run as evidence for both.
naqta_restore: true
naqta_restore_min_p: 0.1
naqta_comma: ","
