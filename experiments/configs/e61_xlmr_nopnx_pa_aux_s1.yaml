experiment_id: e61
model_name: xlm-roberta-large
task_mode: single
subtasks: [NoPnx-PA]
epochs: 10
batch_size: 8
lr: 1.0e-5
max_length: 512
output_dir: outputs/e61
seed: 42
warmup_ratio: 0.1
weight_decay: 0.01
grad_clip: 1.0
num_workers: 4
trust_remote_code: false
pos_weight: 1.0
window_stride: 128
loss_type: recall
recall_beta: 2.0
use_worst_genre: true
genre_cache_dir: outputs/genre_proxy
# Track 2: aux punctuation-restoration head on exact-NoPnx train (isolates aux vs e51)
use_punct_aug: true
punct_aug_source: PA
punct_drop_p: 1.0
n_aux_classes: 3
aux_punct_weight: 0.5
