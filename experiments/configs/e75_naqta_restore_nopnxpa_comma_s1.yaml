experiment_id: e75
model_name: xlm-roberta-large
task_mode: single
subtasks: [NoPnx-PA]
epochs: 10
batch_size: 8
lr: 1.0e-5
max_length: 512
output_dir: outputs/e75
seed: 1
warmup_ratio: 0.1
weight_decay: 0.01
grad_clip: 1.0
num_workers: 4
trust_remote_code: false
pos_weight: 2.0
# Comma-corrected clone of e71 (docs/handoff.md, 2026-07-26): AraSeg's corpus uses the
# ASCII comma exclusively, so the restored TRAINING input should match it -- e71 was
# trained with Naqta's native "،", which never appears in-domain. naqta_comma is a
# per-config knob (naqta_restore.py), never an edit to the shared NAQTA_MARKS; e71/e72
# stay reproducible from the same checkout that produces this config.
naqta_restore: true
naqta_restore_min_p: 0.3
naqta_comma: ","
