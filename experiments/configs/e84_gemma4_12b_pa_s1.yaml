output_dir: outputs/e84
seed: 1
warmup_ratio: 0.1
weight_decay: 0.0
grad_clip: 1.0
num_workers: 4
trust_remote_code: false
pos_weight: 3.0
torch_dtype: bfloat16
bidirectional: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
gradient_checkpointing: true
