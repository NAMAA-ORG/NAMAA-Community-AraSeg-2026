experiment_id: e84
model_name: google/gemma-4-12B  # revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089
task_mode: single
subtasks: [PA]
epochs: 8
batch_size: 2                         # 2 x 2048 tokens ≈ same tokens/step as 8 x 512 BERT batches
